<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racing Boy: Infinite Adventure</title>
<meta name="description" content="Racing Boy: Infinite Adventure - a mobile game by Son Tran. Download on the App Store.">
<meta name="apple-itunes-app" content="app-id=6813405701">
<meta property="og:title" content="Racing Boy: Infinite Adventure">
<meta property="og:description" content="Download Racing Boy: Infinite Adventure on the App Store.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    --ink: #0e2a3b;
    --sea: #1f7a8c;
    --foam: #eaf4f4;
    --buoy: #e4572e;
    --sand: #f2e3c6;
    --bg: var(--foam);
    --text: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0a1d29; --text: #e6f1f1; --sand: #16384a; }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 12vh 24px 48px; }
  h1 {
    font-family: "Baloo 2", system-ui, sans-serif;
    font-weight: 800; line-height: 0.95;
    font-size: clamp(3rem, 14vw, 6.5rem);
    margin: 0 0 8px; letter-spacing: -0.02em;
  }
  h1 span { display: block; color: var(--sea); font-weight: 600; font-size: 0.42em; line-height: 1.1; margin-top: 14px; letter-spacing: 0; }
  p { max-width: 52ch; margin: 20px 0 0; }
  .vi { opacity: 0.8; }
  .cta {
    display: inline-block; margin-top: 36px;
    background: var(--buoy); color: #fff; text-decoration: none;
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: 1.25rem;
    padding: 14px 32px; border-radius: 999px;
    transition: transform .15s ease;
  }
  .cta:hover { transform: translateY(-2px); }
  .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @media (prefers-color-scheme: dark) { .cta:focus-visible { outline-color: #fff; } }
  .wave { display: block; width: 100%; height: 64px; margin-top: 8vh; }
  footer { background: var(--sea); color: #fff; padding: 22px 24px; font-size: 0.9rem; text-align: center; }
  footer a { color: #fff; }
  @media (prefers-reduced-motion: reduce) { .cta { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Racing Boy<span>Infinite Adventure</span></h1>
  <p>A mobile game for iPhone and iPad. Download it free on the App Store.</p>
  <p class="vi">Game di động dành cho iPhone và iPad. Tải miễn phí trên App Store.</p>
  <a class="cta" href="https://apps.apple.com/app/racing-boy-infinite-adventure/id6813405701">Download on the App Store</a>
</main>
<svg class="wave" viewBox="0 0 1200 64" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 32 Q 75 0 150 32 T 300 32 T 450 32 T 600 32 T 750 32 T 900 32 T 1050 32 T 1200 32 V64 H0Z" fill="var(--sea)"/>
</svg>
<footer>
  &copy; 2026 Son Tran
  <!-- Add your contact email or privacy policy link here, e.g.:
  &middot; <a href="mailto:you@example.com">Contact</a> -->
</footer>
</body>
</html>
